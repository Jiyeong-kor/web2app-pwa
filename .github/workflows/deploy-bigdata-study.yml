name: 빅데이터분석기사 학습 앱 배포

on:
  push:
    branches: [main]
    paths:
      - "bigdata-study/**"
      - ".github/workflows/deploy-bigdata-study.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: GitHub Pages 구성
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 정적 앱 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./bigdata-study

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
